<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airtable Hybrid Compiler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
<div class="container">
  <h1 class="mb-4">Airtable Hybrid Compiler (Frontend Orchestration)</h1>
  <div class="mb-3">
    <label class="form-label">Airtable API URL</label>
    <input type="url" id="apiUrl" class="form-control"
           placeholder="https://api.airtable.com/v0/app.../TableName?view=..." required>
  </div>
  <button id="startBtn" class="btn btn-primary">Start Compilation</button>
  <div id="progress" class="mt-3 alert alert-info d-none"></div>
</div>

<script>
async function fetchAllPages(url) {
  const allRecords = [];
  let offset = null;
  let page = 1;
  const progress = document.getElementById('progress');

  do {
    const pagedUrl = offset ? `${url}&offset=${encodeURIComponent(offset)}` : url;
    const res = await fetch(`index.php?url=${encodeURIComponent(pagedUrl)}`);
    const data = await res.json();

    allRecords.push(...(data.records || []));
    offset = data.offset;
    progress.classList.remove('d-none');
    progress.textContent = `Fetched page ${page++}, total records: ${allRecords.length}`;
    await new Promise(r => setTimeout(r, 300)); // rate limit
  } while (offset);

  return allRecords;
}

document.getElementById('startBtn').addEventListener('click', async () => {
  const url = document.getElementById('apiUrl').value.trim();
  if (!url) return alert('Enter Airtable API URL');

  const records = await fetchAllPages(url);
  const res = await fetch('save-compiled-cache.php', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({records})
  });
  const json = await res.json();
  document.getElementById('progress').className =
    'alert ' + (json.status === 'success' ? 'alert-success' : 'alert-danger');
  document.getElementById('progress').textContent =
    json.status === 'success'
      ? `✅ Saved ${json.records} records to ${json.file}`
      : `❌ Error: ${json.error}`;
});
</script>
</body>
</html>
