<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airtable Bound Cache Compiler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #attachmentGrid img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin: 4px;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="p-5 bg-light">
<div class="container">
  <h1 class="mb-4">Airtable Hybrid Caching — Bound Cache + Attachment Toucher</h1>

  <!-- INPUTS -->
  <div class="row g-3 mb-3">
    <div class="col-md-8">
      <label class="form-label">Airtable API URL</label>
      <input type="url" id="apiUrl" class="form-control"
             placeholder="https://api.airtable.com/v0/app.../TableName?view=..." required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Attachment Path</label>
      <input type="text" id="attachmentPath" class="form-control" placeholder="Attachment or Attachment.large">
    </div>
  </div>

  <button id="startBtn" class="btn btn-primary">Start Compilation</button>
  <button id="listBtn" class="btn btn-secondary ms-2">List Bound Caches</button>
  <button id="deleteBtn" class="btn btn-danger ms-2">Delete Bound Cache</button>

  <!-- Cache List -->
  <div id="cacheList" class="mt-4"></div>


  <div id="progressContainer" class="mt-3">
    <h3 id="pageLabel" class="fw-bold text-primary">Page 0</h3>

    <div class="mb-2 fw-bold">Attachment Progress (per page)</div>
    <div class="progress">
      <div id="attachmentProgress" class="progress-bar bg-success" style="width: 0%">0%</div>
    </div>

  </div>

  <div id="statusText" class="mt-3 alert alert-info d-none"></div>
  <div id="elapsedTime" class="text-muted small mt-2 d-none"></div>


  <!-- Attachment Preview Grid -->
  <div id="attachmentGrid" class="mt-4 d-flex flex-wrap"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  async function fetchAllPages(url, attachmentPath) {
    const allRecords = [];
    let offset = null;
    let page = 1;

    const status = document.getElementById('statusText');
    const pageLabel = document.getElementById('pageLabel');
    const attachmentBar = document.getElementById('attachmentProgress');
    const attachmentGrid = document.getElementById('attachmentGrid');
    const progressContainer = document.getElementById('progressContainer');

    // ✅ define safely — even if undefined or empty
    const hasAttachments = attachmentPath && attachmentPath.trim().length > 0;

    // Hide or show attachment UI dynamically
    const progressWrapper = progressContainer.querySelector('.progress');
    const progressLabel = progressContainer.querySelector('.mb-2');
    if (progressWrapper && progressLabel) {
      progressWrapper.style.display = hasAttachments ? '' : 'none';
      progressLabel.style.display = hasAttachments ? '' : 'none';
    }

    do {
      pageLabel.textContent = `Page ${page}`;
      if (attachmentGrid) attachmentGrid.innerHTML = '';

      const pagedUrl = offset ? `${url}&offset=${encodeURIComponent(offset)}` : url;
      const res = await fetch(`index.php?regenerate=${encodeURIComponent(pagedUrl)}&format=json`);
      const data = await res.json();
      const records = data.records || [];

      allRecords.push(...records);
      offset = data.offset;

      status.classList.remove('d-none');
      status.textContent = `Fetched page ${page}, total records so far: ${allRecords.length}`;

      // === ATTACHMENT HANDLING ===
      if (hasAttachments) {
        const pathParts = attachmentPath.split('.');
        const attachmentUrls = [];

        records.forEach(rec => {
          let value = rec.fields;
          for (const part of pathParts) value = value?.[part];
          if (Array.isArray(value)) {
            value.forEach(v => attachmentUrls.push(v.url || v));
          } else if (typeof value === 'string') {
            attachmentUrls.push(value);
          }
        });

        let loadedCount = 0;
        const total = attachmentUrls.length;

        // Reset instantly (no animation when decreasing)
        attachmentBar.classList.remove('progress-bar-animated', 'progress-bar-striped');
        attachmentBar.style.transition = 'none';
        attachmentBar.style.width = '0%';
        attachmentBar.textContent = `0 / ${total}`;
        void attachmentBar.offsetWidth;
        attachmentBar.classList.add('progress-bar-animated', 'progress-bar-striped');
        attachmentBar.style.transition = '';

        for (const fileUrl of attachmentUrls) {
          const proxiedUrl = `index.php?url=${encodeURIComponent(fileUrl)}`;
          const el = document.createElement('img');
          el.src = proxiedUrl;
          el.title = fileUrl.split('/').pop();
          attachmentGrid.appendChild(el);

          await new Promise(resolve => {
            el.onload = el.onerror = () => {
              loadedCount++;
              const pct = total ? Math.round((loadedCount / total) * 100) : 100;
              attachmentBar.style.width = `${pct}%`;
              attachmentBar.textContent = `${loadedCount} / ${total}`;
              resolve();
            };
          });
        }
      }

      page++;
      await new Promise(r => setTimeout(r, 400));
    } while (offset);

    pageLabel.textContent = `All ${page - 1} Pages Fetched`;

    if (hasAttachments) {
      const lastWidth = parseInt(attachmentBar.style.width);
      if (lastWidth > 0) {
        attachmentBar.style.width = '100%';
        attachmentBar.textContent = 'All attachments cached';
      } else {
        attachmentBar.style.width = '0%';
        attachmentBar.textContent = '';
      }
    }

    return allRecords;
  }


  async function saveBoundCache(records, duration, apiUrl) {
    const res = await fetch(`bound-cache.php?action=save&url=${encodeURIComponent(apiUrl)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records, duration })
    });
    return await res.json();
  }


  async function viewBoundCache(url) {
    try {
      if (!url) {
        alert('⚠️ No source URL found for this cache.');
        return;
      }
      const targetUrl = `bound-cache.php?action=get&url=${encodeURIComponent(url)}`;
      window.open(targetUrl, '_blank');
    } catch (err) {
      console.error('Error viewing cache:', err);
      alert('❌ Failed to open bound cache viewer.');
    }
  }





  async function listBoundCaches() {
    const list = document.getElementById('cacheList');
    list.innerHTML = '<div class="text-muted">⏳ Loading bound caches...</div>';

    try {
      const res = await fetch('bound-cache.php?action=list');
      const data = await res.json();

      if (!Array.isArray(data) || data.length === 0) {
        list.innerHTML = '<div class="text-muted">No bound caches found.</div>';
        return;
      }

      let html = `
        <table class="table table-sm table-striped mt-3">
          <thead class="table-light">
            <tr>
              <th>Cache</th>
              <th>Size (KB)</th>
              <th>Created</th>
              <th>Compile Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(item => {
        const sizeKB = (item.size / 1024).toFixed(1);
        const duration = item.duration_seconds
          ? `${Math.floor(item.duration_seconds / 60)}m ${Math.round(item.duration_seconds % 60)}s`
          : '—';

        html += `
          <tr>
            <td>${item.source_url}</td>
            <td>${sizeKB}</td>
            <td>${new Date(item.created_at).toLocaleString()}</td>
            <td>${duration}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary me-2" onclick="viewBoundCache('${item.source_url}')">View</button>
              <button class="btn btn-sm btn-outline-danger" onclick="deleteCache('${item.file}')">Delete</button>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      list.innerHTML = html;

    } catch (e) {
      list.innerHTML = `<div class="text-danger">❌ Error loading caches: ${e.message}</div>`;
    }
  }



  async function deleteCache(file) {
    const progress = document.getElementById('statusText');

    if (!confirm(`Delete ${file}?`)) return;

    progress.className = 'alert alert-info';
    progress.textContent = `🗑️ Deleting ${file}...`;

    try {
      const res = await fetch(`bound-cache.php?action=delete&file=${encodeURIComponent(file)}`);
      const data = await res.json();

      if (data.deleted) {
        progress.className = 'alert alert-success';
        progress.textContent = `✅ Deleted bound cache: ${file}`;
      } else {
        progress.className = 'alert alert-warning';
        progress.textContent = `⚠️ Could not delete: ${file}`;
      }
    } catch (e) {
      progress.className = 'alert alert-danger';
      progress.textContent = `❌ Error deleting: ${e.message}`;
    }

    listBoundCaches();
  }

  // 🔹 Check if bound cache already exists for a given Airtable URL
  async function findBoundCache(apiUrl) {
    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(apiUrl));
    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    const filename = `bound-${hashHex}.json`;

    const res = await fetch('bound-cache.php?action=list');
    const data = await res.json();
    return data.find(item => item.file === filename) || null;
  }

  // 🔹 Touch attachments without changing bound cache
  async function touchAttachments(records, attachmentPath) {
    const pathParts = attachmentPath.split('.');
    const grid = document.getElementById('attachmentGrid');
    grid.innerHTML = '';

    const urls = [];
    records.forEach(r => {
      let val = r.fields;
      for (const p of pathParts) val = val?.[p];
      if (Array.isArray(val)) val.forEach(v => urls.push(v.url || v));
      else if (typeof val === 'string') urls.push(val);
    });

    for (const fileUrl of urls) {
      const img = document.createElement('img');
      img.src = `index.php?url=${encodeURIComponent(fileUrl)}`;
      img.style.width = '80px';
      img.style.margin = '2px';
      grid.appendChild(img);

      await new Promise(resolve => (img.onload = img.onerror = resolve));
    }
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    const url = document.getElementById('apiUrl').value.trim();
    const attachmentPath = document.getElementById('attachmentPath').value.trim();
    const progress = document.getElementById('statusText');

    if (!url) {
      progress.className = 'alert alert-warning';
      progress.textContent = '⚠️ Enter Airtable API URL before starting.';
      return;
    }

    progress.className = 'alert alert-info';
    progress.textContent = '🔍 Checking for existing bound cache...';

    // === Check if bound cache already exists ===
    const existing = await findBoundCache(url);

    // === If cache already exists ===
    if (existing) {
      if (attachmentPath) {
        progress.textContent = '♻️ Bound cache found — refreshing attachments...';

        // load existing cache
        const res = await fetch(`bound-cache.php?action=get&url=${encodeURIComponent(url)}`);
        const data = await res.json();

        // touch attachments (non-destructive)
        await touchAttachments(data.records, attachmentPath);
        progress.className = 'alert alert-success';
        progress.textContent = '✅ Refreshed attachments for existing bound cache.';
      } else {
        progress.className = 'alert alert-warning';
        progress.textContent = '⚠️ Bound cache already exists. No attachment path given, nothing to do.';
      }
      return; // 🛑 stop — do NOT rebuild or overwrite
    }

    // === If cache does NOT exist, perform full compilation ===
    const compileStart = performance.now();
    // ⏱️ Start elapsed timer
    const elapsedEl = document.getElementById('elapsedTime');
    elapsedEl.classList.remove('d-none');

    let elapsed = 0;
    const startTime = new Date();
    elapsedEl.textContent = `Started at ${startTime.toLocaleTimeString()} | Elapsed: ${elapsed}s`;

    const timer = setInterval(() => {
      elapsed++;
      elapsedEl.textContent = `Started at ${startTime.toLocaleTimeString()} | Elapsed: ${elapsed}s`;
    }, 1000);


    progress.className = 'alert alert-info';
    progress.textContent = '⏳ Starting full compilation...';

    const records = await fetchAllPages(url, attachmentPath);

    const compileEnd = performance.now();
    const compileDuration = ((compileEnd - compileStart) / 1000).toFixed(2);

    const result = await saveBoundCache(records, compileDuration, url);
    progress.className = result.status === 'saved' ? 'alert alert-success' : 'alert alert-danger';
    clearInterval(timer);
    const endTime = new Date();
    elapsedEl.textContent =
      `Started at ${startTime.toLocaleTimeString()} → Ended at ${endTime.toLocaleTimeString()} (${elapsed}s total)`;

    progress.textContent =
      result.status === 'saved'
        ? `✅ Compiled cache in ${compileDuration}s (${result.records} records saved)`
        : `❌ Error saving: ${result.error}`;
  });





  document.getElementById('listBtn').addEventListener('click', listBoundCaches);

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const url = document.getElementById('apiUrl').value.trim();
    const progress = document.getElementById('statusText');

    if (!url) {
      progress.className = 'alert alert-warning';
      progress.textContent = '⚠️ Enter Airtable API URL first.';
      return;
    }

    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(url));
    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    const filename = `bound-${hashHex}.json`;

    if (!confirm(`Delete bound cache for this URL?\n\n(${filename})`)) return;

    progress.className = 'alert alert-info';
    progress.textContent = `🗑️ Deleting ${filename}...`;

    try {
      const res = await fetch(`bound-cache.php?action=delete&file=${encodeURIComponent(filename)}`);
      const data = await res.json();

      if (data.deleted) {
        progress.className = 'alert alert-success';
        progress.textContent = `✅ Deleted bound cache: ${filename}`;
      } else {
        progress.className = 'alert alert-warning';
        progress.textContent = `⚠️ Could not delete bound cache: ${filename}`;
      }
    } catch (e) {
      progress.className = 'alert alert-danger';
      progress.textContent = `❌ Error deleting cache: ${e.message}`;
    }

    listBoundCaches();
  });

  // expose to global for inline HTML triggers
  window.viewBoundCache = viewBoundCache;
  window.deleteCache = deleteCache;

});


</script>

</body>
</html>
