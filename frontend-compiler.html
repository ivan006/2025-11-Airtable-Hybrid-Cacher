<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airtable Bound Cache Compiler</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #attachmentGrid img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin: 4px;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body class="p-5 bg-light">
<div class="container">
  <h1 class="mb-4">Airtable Hybrid Caching — Bound Cache + Attachment Toucher</h1>

  <!-- INPUTS -->
  <div class="row g-3 mb-3">
    <div class="col-md-8">
      <label class="form-label">Airtable API URL</label>
      <input type="url" id="apiUrl" class="form-control"
             placeholder="https://api.airtable.com/v0/app.../TableName?view=..." required>
    </div>
    <div class="col-md-4">
      <label class="form-label">Attachment Path</label>
      <input type="text" id="attachmentPath" class="form-control" placeholder="Attachment or Attachment.large">
    </div>
  </div>

  <button id="startBtn" class="btn btn-primary">Start Compilation</button>
  <button id="listBtn" class="btn btn-secondary ms-2">List Bound Caches</button>
  <button id="deleteBtn" class="btn btn-danger ms-2">Delete Bound Cache</button>


  <div id="progressContainer" class="mt-3">
    <h3 id="pageLabel" class="fw-bold text-primary">Page 0</h3>

    <div class="mb-2 fw-bold">Attachment Progress (per page)</div>
    <div class="progress">
      <div id="attachmentProgress" class="progress-bar bg-success" style="width: 0%">0%</div>
    </div>

  </div>

  <div id="statusText" class="mt-3 alert alert-info d-none"></div>


  <!-- Cache List -->
  <div id="cacheList" class="mt-4"></div>

  <!-- Attachment Preview Grid -->
  <div id="attachmentGrid" class="mt-4 d-flex flex-wrap"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  async function fetchAllPages(url, attachmentPath) {
    const allRecords = [];
    let offset = null;
    let page = 1;
    const status = document.getElementById('statusText');
    const pageLabel = document.getElementById('pageLabel');
    const attachmentBar = document.getElementById('attachmentProgress');
    const attachmentGrid = document.getElementById('attachmentGrid');

    do {
      pageLabel.textContent = `Page ${page}`;

      // clear out previous page’s attachments before starting new batch
      attachmentGrid.innerHTML = '';

      const pagedUrl = offset ? `${url}&offset=${encodeURIComponent(offset)}` : url;
      const res = await fetch(`index.php?url=${encodeURIComponent(pagedUrl)}&format=json`);
      const data = await res.json();
      const records = data.records || [];

      allRecords.push(...records);
      offset = data.offset;

      status.classList.remove('d-none');
      status.textContent = `Fetched page ${page}, total records so far: ${allRecords.length}`;

      // === ATTACHMENT LOADING WITH SUB PROGRESS ===
      if (attachmentPath) {
        const pathParts = attachmentPath.split('.');
        const attachmentUrls = [];
        records.forEach(rec => {
          let value = rec.fields;
          for (const part of pathParts) value = value?.[part];
          if (Array.isArray(value)) {
            value.forEach(v => attachmentUrls.push(v.url || v));
          } else if (typeof value === 'string') {
            attachmentUrls.push(value);
          }
        });

        let loadedCount = 0;
        const totalAttachments = attachmentUrls.length;
        // Reset attachment progress instantly (no animation)
        attachmentBar.classList.remove('progress-bar-animated', 'progress-bar-striped');
        attachmentBar.style.transition = 'none';
        attachmentBar.style.width = '0%';
        attachmentBar.textContent = `0 / ${totalAttachments}`;

        // Force reflow to commit the instant reset before re-enabling animation
        void attachmentBar.offsetWidth;

        // Re-enable animation for forward progress
        attachmentBar.classList.add('progress-bar-animated', 'progress-bar-striped');
        attachmentBar.style.transition = '';


        for (const imgUrl of attachmentUrls) {
          const proxiedUrl = `index.php?url=${encodeURIComponent(imgUrl)}`;
          const img = document.createElement('img');
          img.src = proxiedUrl;
          img.title = imgUrl.split('/').pop();
          attachmentGrid.appendChild(img);

          await new Promise(resolve => {
            img.onload = img.onerror = () => {
              loadedCount++;
              const pct = totalAttachments ? Math.round((loadedCount / totalAttachments) * 100) : 100;
              attachmentBar.style.width = `${pct}%`;
              attachmentBar.textContent = `${loadedCount} / ${totalAttachments}`;
              resolve();
            };
          });
        }
      }

      page++;
      await new Promise(r => setTimeout(r, 400)); // small rate-limit delay
    } while (offset);

    pageLabel.textContent = `All ${page - 1} Pages Fetched`;

    if (hasAttachments) {
      // only show message if we actually processed at least one attachment
      const lastWidth = parseInt(attachmentBar.style.width);
      if (lastWidth > 0) {
        attachmentBar.style.width = '100%';
        attachmentBar.textContent = 'All attachments cached';
      } else {
        attachmentBar.style.width = '0%';
        attachmentBar.textContent = '';
      }
    }

    return allRecords;

  }

  async function saveBoundCache(records, duration) {
    const res = await fetch('bound-cache.php?action=save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records, duration })
    });
    return await res.json();
  }


  async function listBoundCaches() {
    const res = await fetch('bound-cache.php?action=list');
    const data = await res.json();
    const listDiv = document.getElementById('cacheList');
    listDiv.innerHTML = '<h4>Existing Bound Caches</h4>';

    if (!data.length) {
      listDiv.innerHTML += '<p>No bound caches found.</p>';
      return;
    }

    const table = document.createElement('table');
    table.className = 'table table-bordered';
    table.innerHTML = `
      <thead>
        <tr><th>File</th><th>Size (bytes)</th><th>Modified</th><th>Actions</th></tr>
      </thead>
      <tbody>
        ${data.map(f => `
          <tr>
            <td>${f.file}</td>
            <td>${f.size}</td>
            <td>${f.modified}</td>
            <td>
              <a href="cache/${f.file}" target="_blank" class="btn btn-sm btn-success">View</a>
              <button class="btn btn-sm btn-danger" onclick="deleteCache('${f.file}')">Delete</button>
            </td>
          </tr>`).join('')}
      </tbody>`;
    listDiv.appendChild(table);
  }

  async function deleteCache(file) {
    const progress = document.getElementById('statusText');

    if (!confirm(`Delete ${file}?`)) return;

    progress.className = 'alert alert-info';
    progress.textContent = `🗑️ Deleting ${file}...`;

    try {
      const res = await fetch(`bound-cache.php?action=delete&file=${encodeURIComponent(file)}`);
      const data = await res.json();

      if (data.deleted) {
        progress.className = 'alert alert-success';
        progress.textContent = `✅ Deleted bound cache: ${file}`;
      } else {
        progress.className = 'alert alert-warning';
        progress.textContent = `⚠️ Could not delete: ${file}`;
      }
    } catch (e) {
      progress.className = 'alert alert-danger';
      progress.textContent = `❌ Error deleting: ${e.message}`;
    }

    listBoundCaches();
  }


  document.getElementById('startBtn').addEventListener('click', async () => {
    const url = document.getElementById('apiUrl').value.trim();
    const path = document.getElementById('attachmentPath').value.trim();
    const progress = document.getElementById('statusText');

    if (!url) {
      progress.className = 'alert alert-warning';
      progress.textContent = '⚠️ Enter Airtable API URL before starting.';
      return;
    }

    const compileStart = performance.now(); // ⏱️ start compile timer

    progress.className = 'alert alert-info';
    progress.textContent = '⏳ Starting compilation...';

    document.getElementById('attachmentGrid').innerHTML = '';
    const records = await fetchAllPages(url, path);

    const compileEnd = performance.now(); // ⏱️ end compile timer
    const compileDuration = ((compileEnd - compileStart) / 1000).toFixed(2);

    const result = await saveBoundCache(records, compileDuration);

    progress.className = result.status === 'saved' ? 'alert alert-success' : 'alert alert-danger';
    progress.textContent =
      result.status === 'saved'
        ? `✅ Compiled cache in ${compileDuration}s (${result.records} records saved)`
        : `❌ Error saving: ${result.error}`;
  });



  document.getElementById('listBtn').addEventListener('click', listBoundCaches);

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    const url = document.getElementById('apiUrl').value.trim();
    const progress = document.getElementById('statusText');

    if (!url) {
      progress.className = 'alert alert-warning';
      progress.textContent = '⚠️ Enter Airtable API URL first.';
      return;
    }

    const hashBuffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(url));
    const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    const filename = `merged-${hashHex}.json`;

    if (!confirm(`Delete bound cache for this URL?\n\n(${filename})`)) return;

    progress.className = 'alert alert-info';
    progress.textContent = `🗑️ Deleting ${filename}...`;

    try {
      const res = await fetch(`bound-cache.php?action=delete&file=${encodeURIComponent(filename)}`);
      const data = await res.json();

      if (data.deleted || data.status === 'deleted') {
        progress.className = 'alert alert-success';
        progress.textContent = `✅ Deleted bound cache: ${file}`;
      } else {
        progress.className = 'alert alert-warning';
        progress.textContent = `⚠️ Could not delete bound cache: ${filename}`;
      }
    } catch (e) {
      progress.className = 'alert alert-danger';
      progress.textContent = `❌ Error deleting cache: ${e.message}`;
    }

    listBoundCaches();
  });


});
</script>

</body>
</html>
